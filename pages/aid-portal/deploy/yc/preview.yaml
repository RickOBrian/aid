# Шлюз presentbook-preview — preview.aidteam.pro/pr-N/ (ADR-038). Подстановки:
# ${FUNCTION_ID}, ${GATEWAY_SA_ID}.
#
# Всё, кроме /api, отдаёт функция: маршрут «параметр–литерал»
# (/{pr}/assets/{path+}) шлюз разбирает неверно, а object_storage портит типы
# (прототип 2026-10-02). Превью — небольшой трафик, холодный старт приемлем.
#
# Вызов — по метке prod. Запросы /pr-N/api/... эта версия переадресует в
# версию функции с меткой pr-N (код API из PR), если она есть.
openapi: 3.0.0
info: { title: presentbook-preview, version: 1.0.0 }
paths:
  /api/login:
    post:
      x-yc-apigateway-integration: { type: cloud_functions, function_id: '${FUNCTION_ID}', tag: prod, service_account_id: '${GATEWAY_SA_ID}' }
  /api/session:
    get:
      x-yc-apigateway-integration: { type: cloud_functions, function_id: '${FUNCTION_ID}', tag: prod, service_account_id: '${GATEWAY_SA_ID}' }
  /api/plugin-version:
    get:
      x-yc-apigateway-integration: { type: cloud_functions, function_id: '${FUNCTION_ID}', tag: prod, service_account_id: '${GATEWAY_SA_ID}' }
  /{pr}:
    get:
      parameters: [ { name: pr, in: path, required: true, schema: { type: string } } ]
      x-yc-apigateway-integration: { type: cloud_functions, function_id: '${FUNCTION_ID}', tag: prod, service_account_id: '${GATEWAY_SA_ID}' }
  /{pr}/{path+}:
    get:
      parameters: [ { name: pr, in: path, required: true, schema: { type: string } }, { name: path, in: path, required: true, schema: { type: string } } ]
      x-yc-apigateway-integration: { type: cloud_functions, function_id: '${FUNCTION_ID}', tag: prod, service_account_id: '${GATEWAY_SA_ID}' }
