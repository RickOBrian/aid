# Временное зеркало Presentbook (AID-18). Подстановки: __DOMAIN__ — адрес
# зеркала (например <ip>.sslip.io), __ROOT__ — папка со статикой (dist/).
# HTTPS добавляет certbot: sudo certbot --nginx -d __DOMAIN__
server {
    listen 80;
    server_name __DOMAIN__;

    root __ROOT__;
    index index.html;

    # API — Node-сервер на локальном порту.
    location /api/ {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 64k;
    }

    # Сборка с хэшем в имени — кэш на год.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Маршруты SPA — index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
