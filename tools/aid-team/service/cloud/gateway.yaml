openapi: 3.0.0
info:
  title: team-tasks
  version: 1.0.0
# Сервис задач команды AID — team.aidteam.pro (tools/aid-team/SERVICE.md).
# ${FUNCTION_ID} и ${GATEWAY_SA_ID} подставляет workflow деплоя.
# Только литеральные пути и один параметр в конце: шлюз неверно разбирает
# «параметр, потом литерал».
x-yc-apigateway:
  service_account_id: ${GATEWAY_SA_ID}
paths:
  /v1/{path+}:
    x-yc-apigateway-any-method:
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${FUNCTION_ID}
        service_account_id: ${GATEWAY_SA_ID}
        payload_format_version: '1.0'
