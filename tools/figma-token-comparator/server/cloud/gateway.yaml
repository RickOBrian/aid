# API Gateway `registry-api` в Яндекс Облаке (ADR-038).
#
# Все пути и все методы, включая OPTIONS для preflight из Figma, идут в одну
# функцию: CORS и 405 отвечает она сама, как на Vercel, поэтому заголовки
# описаны в одном месте — server/api/_lib/cors.ts.
#
# Только литеральные пути: маршруты вида /{x}/lit/{path+} шлюз разбирает
# неверно (прототип Presentbook).
#
# ${FUNCTION_ID} и ${GATEWAY_SA_ID} подставляет workflow деплоя из
# переменных репозитория; у сервисного аккаунта — functions.functionInvoker.
openapi: 3.0.0
info:
  title: registry-api
  version: 1.0.0
paths:
  /api/registry:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${FUNCTION_ID}
        service_account_id: ${GATEWAY_SA_ID}
  /api/registry/proposal-status:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${FUNCTION_ID}
        service_account_id: ${GATEWAY_SA_ID}
  /api/registry/propose-decision:
    x-yc-apigateway-any-method:
      x-yc-apigateway-integration:
        type: cloud_functions
        function_id: ${FUNCTION_ID}
        service_account_id: ${GATEWAY_SA_ID}
