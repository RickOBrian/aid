<body data-storybook-page="sutochno/components/button-text" data-product="sutochno">

<div class="storybook-layout">

  <header class="layout__header storybook-layout__header">
    <div class="header__logo">
      <a href="../../../../index.html" style="text-decoration:none">
        <span class="header__eyebrow">Design System</span>
        <span class="header__title storybook-header__title">System Storybook</span>
      </a>
    </div>

    <div class="header__controls">
      <button class="btn-icon" id="theme-toggle"
              aria-label="Переключить тему" title="Переключить тему">
        <svg id="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="display:none">
          <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg id="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5Z"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <aside class="layout__sidebar storybook-layout__sidenav" aria-label="Storybook navigation">
    <nav class="storybook-nav" id="storybook-nav" aria-label="Storybook sections"></nav>
    <div class="storybook-nav__footer">
      <a class="storybook-nav__back" href="../../../../index.html">← Docs</a>
    </div>
  </aside>

  <main class="storybook-layout__content">
    <p class="component-doc-breadcrumb">
      <a href="../../../product.html?product=sutochno">← Sutochno</a>
      ·
      <a href="../../../product-components.html?product=sutochno">Components</a>
    </p>

    <div id="guide-page"></div>

    <section class="storybook-section" aria-labelledby="sbt-matrix-heading">
      <h2 id="sbt-matrix-heading">Live preview — все варианты × размеры</h2>
      <p>7 вариантов × 4 размера. Tiny — pill + trailing chevron, без leading icon.</p>
      <div id="sbt-matrix"></div>
    </section>

    <section class="storybook-section" aria-labelledby="sbt-states-heading">
      <h2 id="sbt-states-heading">Live preview — состояния</h2>
      <div id="sbt-states" class="sbt-preview-states"></div>
    </section>
  </main>

</div>

<script src="../../../storybook.js"></script>
<script src="../../../product-storybook.js"></script>
<script src="../../../product-legacy-colors.js"></script>
<script src="../../../product-sutochno-button-text.js"></script>
<script>

<script src="../../../measure-agents.js"></script>
<script src="../../../guide-page.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  const sb = window.DSProductStorybook;
  const productId = 'sutochno';
  sb.setActivePage(productId, 'components/button-text');
  await sb.applyProductAssets(productId);
  await window.DSProductLegacyColors.apply('/tokens/sutochno/legacy/legacy-tokens.json');
  DSGuidePage.render(document.getElementById('guide-page'));
  window.DSSutochnoButtonText.renderMatrix(document.getElementById('sbt-matrix'));
  window.DSSutochnoButtonText.renderStates(document.getElementById('sbt-states'));
});
</script>
</body>
