<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — System Storybook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/docs-theme.css">
  <link rel="stylesheet" href="storybook-color-tokens.css">
  <link rel="stylesheet" href="storybook-layout.css">
  <link rel="stylesheet" href="storybook-product-tokens.css">
</head>
<body data-storybook-page="product">

<div class="storybook-layout storybook-layout--product">

  <header class="layout__header storybook-layout__header">
    <div class="header__logo">
      <a href="index.html" style="text-decoration:none">
        <span class="header__eyebrow">Design System</span>
        <span class="header__title storybook-header__title">System Storybook</span>
      </a>
    </div>

    <div class="header__controls">
      <button class="btn-icon" id="theme-toggle"
              aria-label="Переключить тему" title="Переключить тему">
        <svg id="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="display:none">
          <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg id="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5Z"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <aside class="layout__sidebar storybook-layout__sidenav" aria-label="Storybook navigation">
    <nav class="storybook-nav" id="storybook-nav" aria-label="Storybook sections"></nav>
    <div class="storybook-nav__footer">
      <a class="storybook-nav__back" href="../index.html">← Docs</a>
    </div>
  </aside>

  <main class="storybook-layout__content">
    <header class="storybook-page-header">
      <h1 id="product-title">Product</h1>
      <p id="product-desc">Токены и компоненты продукта из <code>tokens/{product}/</code> и <code>stories/{product}/</code>.</p>
      <div class="product-tokens__meta" id="product-meta"></div>
    </header>

    <section class="storybook-section" aria-labelledby="product-tokens-heading">
      <h2 id="product-tokens-heading">Tokens</h2>
      <ul class="product-hub__list" id="product-tokens-links"></ul>
    </section>

    <section class="storybook-section" aria-labelledby="product-components-heading">
      <h2 id="product-components-heading">Components</h2>
      <ul class="product-hub__list" id="product-components-links"></ul>
    </section>
  </main>

</div>

<script src="storybook.js"></script>
<script src="product-storybook.js"></script>
<script>
(function () {
  'use strict';
  const sb = window.DSProductStorybook;

  document.addEventListener('DOMContentLoaded', async () => {
    const productId = sb.productFromUrl();
    const titleEl = document.getElementById('product-title');
    const metaEl = document.getElementById('product-meta');
    const tokensLinks = document.getElementById('product-tokens-links');
    const componentsLinks = document.getElementById('product-components-links');

    if (!productId) {
      if (titleEl) titleEl.textContent = 'Product';
      if (tokensLinks) tokensLinks.innerHTML = '<li class="storybook-status is-error">Укажите <code>?product=sutochno</code></li>';
      return;
    }

    try {
      const product = await sb.loadProduct(productId);
      sb.setActivePage(productId, 'index');
      if (titleEl) titleEl.textContent = product.label;
      if (metaEl) {
        metaEl.innerHTML = `
          <span>ID: <code>${sb.escapeHtml(product.id)}</code></span>
          ${product.status ? `<span>Status: <code>${sb.escapeHtml(product.status)}</code></span>` : ''}
        `;
      }
      if (tokensLinks) {
        const tokenItems = ['<li><a href="product-colors.html?product=' + sb.escapeHtml(productId) + '">Colors</a></li>'];
        if (product.tokens?.typography) {
          tokenItems.push('<li><a href="product-typography.html?product=' + sb.escapeHtml(productId) + '">Typography</a></li>');
        }
        tokensLinks.innerHTML = tokenItems.join('');
      }
      if (componentsLinks) {
        componentsLinks.innerHTML = `
          <li><a href="product-components.html?product=${sb.escapeHtml(productId)}">Overview</a></li>
        `;
      }
    } catch (err) {
      if (tokensLinks) tokensLinks.innerHTML = `<li class="storybook-status is-error">${sb.escapeHtml(err.message)}</li>`;
    }
  });
})();
</script>
</body>
</html>
