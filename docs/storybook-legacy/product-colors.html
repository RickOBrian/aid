<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Colors — System Storybook</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/docs-theme.css">
  <link rel="stylesheet" href="storybook-color-tokens.css">
  <link rel="stylesheet" href="storybook-layout.css">
  <link rel="stylesheet" href="storybook-colors.css">
  <link rel="stylesheet" href="storybook-product-tokens.css">
</head>
<body data-storybook-page="product-colors">

<div class="storybook-layout storybook-layout--colors">

  <header class="layout__header storybook-layout__header">
    <div class="header__logo">
      <a href="index.html" style="text-decoration:none">
        <span class="header__eyebrow">Design System</span>
        <span class="header__title storybook-header__title">System Storybook</span>
      </a>
    </div>

    <div class="header__controls">
      <button class="btn-icon" id="theme-toggle"
              aria-label="Переключить тему" title="Переключить тему">
        <svg id="icon-sun" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true" style="display:none">
          <circle cx="8" cy="8" r="3" stroke="currentColor" stroke-width="1.5"/>
          <path d="M8 1v1.5M8 13.5V15M1 8h1.5M13.5 8H15M3.05 3.05l1.06 1.06M11.89 11.89l1.06 1.06M3.05 12.95l1.06-1.06M11.89 4.11l1.06-1.06"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
        <svg id="icon-moon" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M13.5 10A6 6 0 0 1 6 2.5a6 6 0 1 0 7.5 7.5Z"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </header>

  <aside class="layout__sidebar storybook-layout__sidenav" aria-label="Storybook navigation">
    <nav class="storybook-nav" id="storybook-nav" aria-label="Storybook sections"></nav>
    <div class="storybook-nav__footer">
      <a class="storybook-nav__back" href="../index.html">← Docs</a>
    </div>
  </aside>

  <main class="storybook-layout__content">
    <header class="storybook-page-header">
      <p class="component-doc-breadcrumb" id="product-breadcrumb"></p>
      <h1 id="product-title">Colors</h1>
      <p id="product-description">
        Read-only цветовые токены продукта из <code>tokens/{product}/</code>.
      </p>
    </header>

    <div class="storybook-tabs" id="product-color-tabs" role="tablist" aria-label="Color token levels" hidden>
      <button type="button" class="storybook-tabs__btn" role="tab"
              data-tab="core" id="tab-btn-core" aria-controls="tab-core">Core</button>
      <button type="button" class="storybook-tabs__btn" role="tab"
              data-tab="semantic" id="tab-btn-semantic" aria-controls="tab-semantic">Semantic</button>
      <button type="button" class="storybook-tabs__btn" role="tab"
              data-tab="legacy" id="tab-btn-legacy" aria-controls="tab-legacy">Legacy</button>
    </div>

    <div class="storybook-tab-panel" id="tab-core" role="tabpanel" aria-labelledby="tab-btn-core" hidden>
      <div id="tab-core-content"><p class="storybook-status">Загрузка Core tokens…</p></div>
    </div>

    <div class="storybook-tab-panel" id="tab-semantic" role="tabpanel" aria-labelledby="tab-btn-semantic" hidden>
      <div id="tab-semantic-content"><p class="storybook-status">Загрузка Semantic tokens…</p></div>
    </div>

    <div class="storybook-tab-panel" id="tab-legacy" role="tabpanel" aria-labelledby="tab-btn-legacy" hidden>
      <div id="tab-legacy-content"><p class="storybook-status">Загрузка Legacy tokens…</p></div>
    </div>
  </main>

  <aside class="storybook-layout__toc" aria-label="On this page">
    <div class="storybook-toc__label">On this page</div>
    <nav class="storybook-toc__list" id="page-toc-list"></nav>
  </aside>

</div>

<script src="storybook.js"></script>
<script src="product-storybook.js"></script>
<script src="color-swatch-utils.js"></script>
<script src="product-tokens-viewer.js"></script>
</body>
</html>
