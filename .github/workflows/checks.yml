name: checks

# Проверки, которые до 2026-09-20 запускались только когда о них вспоминали.
# Ровно эту болезнь мы лечили у guide-lint: требованиям формы соответствовали
# 7 файлов из 40, потому что проверка зависела от памяти человека.
#
# Здесь всё, что умеет падать само:
#   check-docs  — форма документов, живость ссылок, сходимость версий,
#                 дубли имён, легаси-пути, согласованность машинных слоёв
#   typecheck   — приложение портала целиком, не только api/
#   test        — тесты компонентов и стражи находок аудита
#   build       — сборка портала, включая генерацию гайдов из .md
#   plugin      — Token Comparator и его сервер: типы, тесты, сборка

on:
  pull_request:
  push:
    branches: [main]

jobs:
  docs:
    name: Документы
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # check-docs не требует зависимостей — только стандартная библиотека node
      - run: node scripts/check-docs.mjs

  portal:
    name: Портал
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages/aid-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pages/aid-portal/package-lock.json
      - run: npm ci
      # Тесты появились 2026-09-21, на день позже самого workflow, и в список
      # не попали: 31 тест, включая двух стражей находок аудита, не запускался
      # ни на одном PR. Страж, который не гоняется, сторожит только дисциплину
      # того, кто помнит запустить его руками.
      - run: npm run typecheck
      - run: npm test
      # prebuild здесь важен: он же проверяет осиротевшие changelog-файлы
      # и собирает гайды из канонических .md
      - run: npm run build
      # Снимки матрицы вариант × состояние в обеих темах и axe (DoD п.7) —
      # в настоящем Chromium: jsdom не рисует, не считает контраст и не
      # знает :hover и :focus-visible. Эталоны для Linux свои — шрифты
      # здесь рендерятся иначе, чем на macOS.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      # При падении — новые снимки, эталоны и диффы, чтобы посмотреть их
      # глазами и, если вид изменился намеренно, забрать эталоны в PR.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: portal-screenshots
          path: |
            pages/aid-portal/components/__screenshots__/
            pages/aid-portal/.vitest/attachments/
          if-no-files-found: ignore

  plugin:
    name: Плагин
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/figma-token-comparator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            tools/figma-token-comparator/package-lock.json
            tools/figma-token-comparator/server/package-lock.json
      # Плагин и его сервер жили без CI вовсе: 326 тестов плагина и 75 тестов
      # сервера запускались только руками перед релизом. Архив для дизайнеров
      # собирается из main, значит main должен быть проверен всегда.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm ci
        working-directory: tools/figma-token-comparator/server
      - run: npm run typecheck
        working-directory: tools/figma-token-comparator/server
      - run: npm test
        working-directory: tools/figma-token-comparator/server
