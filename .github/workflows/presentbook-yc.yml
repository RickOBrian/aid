name: presentbook-yc

# Presentbook в Яндекс Облаке (ADR-038).
#   push в main      → сборка base=/, бакет presentbook-site, функция presentbook-api, смоук-тест
#   pull request     → сборка base=/pr-N/, бакет presentbook-preview/pr-N/, смоук-тест, ссылка в PR
#   PR закрыт        → папка pr-N удаляется
#
# Пути — те же, что читает сборка портала (раньше это был ignoreCommand в
# pages/aid-portal/vercel.json).
#
# Secrets (значения заводит PD):
#   YC_CI_SA_KEY_JSON      — авторизованный ключ сервисного аккаунта presentbook-ci (JSON)
#   YC_S3_ACCESS_KEY_ID    — статический ключ presentbook-ci для Object Storage
#   YC_S3_SECRET_KEY       — его секретная часть
# Variables:
#   YC_FOLDER_ID           — каталог presentbook
#   PRESENTBOOK_SITE_URL   — адрес основного сайта (до переключения домена — домен шлюза)
#   PRESENTBOOK_PREVIEW_URL — адрес превью без /pr-N
#   YC_RUNTIME_SA_ID       — сервисный аккаунт presentbook-runtime (от его имени работает функция)
#   YC_LOCKBOX_AUTH_ID     — секрет presentbook-auth
#   YC_LOCKBOX_GITHUB_ID   — секрет presentbook-github

on:
  push:
    branches: [main]
    paths:
      - 'pages/aid-portal/**'
      - 'skills/_shared/**'
      - 'tokens/**'
      - 'components/**'
      - 'changes/driver/pending/**'
      - 'products/registry.json'
      - '.github/workflows/presentbook-yc.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'pages/aid-portal/**'
      - 'skills/_shared/**'
      - 'tokens/**'
      - 'components/**'
      - 'changes/driver/pending/**'
      - 'products/registry.json'
      - '.github/workflows/presentbook-yc.yml'
  # История релизов плагина для changelog на странице Token Comparator:
  # сразу при публикации релиза и раз в 15 минут на всякий случай.
  release:
    types: [published]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # Отдельные группы: запуск по расписанию не отменяет выкладку из main.
  group: presentbook-yc-${{ github.event.pull_request.number || github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.YC_S3_SECRET_KEY }}
  AWS_DEFAULT_REGION: ru-central1
  S3: aws s3 --endpoint-url=https://storage.yandexcloud.net

jobs:
  deploy:
    name: Выкладка
    # PR из форков secrets не получают — для них превью не собирается.
    if: github.event.action != 'closed' && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pages/aid-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pages/aid-portal/package-lock.json
      - run: npm ci

      - name: Куда выкладывать
        id: target
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            pr="pr-${{ github.event.pull_request.number }}"
            echo "base=/$pr/" >> "$GITHUB_OUTPUT"
            echo "dest=s3://presentbook-preview/$pr" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.PRESENTBOOK_PREVIEW_URL }}/$pr" >> "$GITHUB_OUTPUT"
          else
            echo "base=/" >> "$GITHUB_OUTPUT"
            echo "dest=s3://presentbook-site" >> "$GITHUB_OUTPUT"
            echo "url=${{ vars.PRESENTBOOK_SITE_URL }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Сборка
        run: npm run build -- --base=${{ steps.target.outputs.base }}

      # Тип файла задаётся явно: интеграция шлюза берёт его из объекта, а без
      # него JS приходит как text/plain и браузер его не запускает (прототип).
      # aws s3 cp/sync определяет тип по расширению; svg и json — проверяем.
      - name: Загрузка в бакет
        run: |
          dest=${{ steps.target.outputs.dest }}
          $S3 sync dist/assets "$dest/assets" --cache-control 'public, max-age=31536000, immutable'
          $S3 sync dist "$dest" --exclude 'assets/*' --exclude 'index.html' --cache-control 'public, max-age=300'
          $S3 cp dist/index.html "$dest/index.html" --content-type 'text/html; charset=utf-8' --cache-control 'no-cache'

      # Функция: из main — версия с меткой prod (её вызывают шлюзы), из PR —
      # версия с меткой pr-N (её вызывает только превью этого PR через
      # /pr-N/api/...). Так изменения в api/ видны на превью до мержа.
      - name: Функция presentbook-api
        env:
          YC_KEY: ${{ secrets.YC_CI_SA_KEY_JSON }}
          TAG: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'prod' }}
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          export PATH="$HOME/yc/bin:$PATH"
          printf '%s' "$YC_KEY" > "$RUNNER_TEMP/key.json"
          # Свежий yc без профиля не знает адрес API: без этого serverless-команды
          # падают с «endpoint should be set» (первая выкладка, run 37113551002).
          yc config set endpoint api.cloud.yandex.net:443
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set folder-id "${{ vars.YC_FOLDER_ID }}"
          rm -f "$RUNNER_TEMP/key.json"
          npm run build:yc-function
          (cd deploy/yc/dist/presentbook-api && zip -q ../presentbook-api.zip index.js)
          auth="${{ vars.YC_LOCKBOX_AUTH_ID }}"
          gh_token="${{ vars.YC_LOCKBOX_GITHUB_ID }}"
          runtime="${{ vars.YC_RUNTIME_SA_ID }}"
          function_id=$(yc serverless function get --name presentbook-api --format json | jq -r .id)
          version_id=$(yc serverless function version create --function-name presentbook-api --format json \
            --runtime nodejs22 --entrypoint index.handler --memory 256m --execution-timeout 15s \
            --source-path deploy/yc/dist/presentbook-api.zip --service-account-id "$runtime" \
            --environment PREVIEW_STORAGE_URL=https://storage.yandexcloud.net/presentbook-preview,FUNCTION_ID=$function_id,PLUGIN_HISTORY_URL=https://storage.yandexcloud.net/presentbook-site/data/plugin-history.json \
            --secret environment-variable=BASIC_AUTH_USER,id=$auth,key=BASIC_AUTH_USER \
            --secret environment-variable=BASIC_AUTH_PASSWORD,id=$auth,key=BASIC_AUTH_PASSWORD \
            --secret environment-variable=AUTH_COOKIE_SECRET,id=$auth,key=AUTH_COOKIE_SECRET \
            --secret environment-variable=GITHUB_RELEASES_TOKEN,id=$gh_token,key=GITHUB_RELEASES_TOKEN \
            | jq -r .id)
          # Метка переезжает на новую версию; $latest шлюзы не используют.
          yc serverless function version set-tag --id "$version_id" --tag "$TAG"
          echo "presentbook-api: версия $version_id, метка $TAG"

      # Смоук-тест: схема шлюза опирается на поведение, которое не описано в
      # документации YC (типы, разбор маршрутов) — проверяем после каждой выкладки.
      - name: Смоук-тест
        run: bash deploy/yc/smoke.sh "${{ steps.target.outputs.url }}"

      - name: Ссылка на превью в PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="${{ steps.target.outputs.url }}/"
          marker='<!-- presentbook-preview -->'
          body="$marker
          Превью Presentbook: $url"
          existing=$(gh api "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" -f body="$body" >/dev/null
          else
            gh pr comment ${{ github.event.pull_request.number }} --body "$body"
          fi

  # Список релизов GitHub тянется в Яндекс Облако дольше 9 секунд, а на
  # раннере GitHub — за секунду. Поэтому историю собирает CI и кладёт в бакет
  # сайта, функция читает готовый файл (PLUGIN_HISTORY_URL).
  history:
    name: Changelog плагина
    if: contains(fromJSON('["push", "schedule", "release", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            pages/aid-portal/api/_lib
            pages/aid-portal/deploy/yc
            pages/aid-portal/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Собрать и выложить plugin-history.json
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node pages/aid-portal/deploy/yc/plugin-history.ts > "$RUNNER_TEMP/plugin-history.json"
          $S3 cp "$RUNNER_TEMP/plugin-history.json" s3://presentbook-site/data/plugin-history.json \
            --content-type 'application/json; charset=utf-8' --cache-control 'no-cache'

  cleanup:
    name: Удаление превью
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - run: $S3 rm "s3://presentbook-preview/pr-${{ github.event.pull_request.number }}" --recursive
      - name: Снять метку pr-N с версии функции
        env:
          YC_KEY: ${{ secrets.YC_CI_SA_KEY_JSON }}
          TAG: pr-${{ github.event.pull_request.number }}
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n
          export PATH="$HOME/yc/bin:$PATH"
          printf '%s' "$YC_KEY" > "$RUNNER_TEMP/key.json"
          yc config set endpoint api.cloud.yandex.net:443
          yc config set service-account-key "$RUNNER_TEMP/key.json"
          yc config set folder-id "${{ vars.YC_FOLDER_ID }}"
          rm -f "$RUNNER_TEMP/key.json"
          version_id=$(yc serverless function version get-by-tag --function-name presentbook-api --tag "$TAG" --format json 2>/dev/null | jq -r '.id // empty')
          if [ -n "$version_id" ]; then
            yc serverless function version remove-tag --id "$version_id" --tag "$TAG"
          fi
